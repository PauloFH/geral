# Dia a dia da Carreira (modo Completa): uma situação por temporada, dos 17 anos em diante.
# Cada opção tem chance (%) de dar certo; bonus = atributo que soma (nota - 70) / 2 à chance.
# sucesso / fracasso = efeito na temporada que vem: atributos = { passe = 2 }, nota (forma),
# jogos (parte da temporada, 0.6 = perde 40%), saida (clima para sair), selecao (convocação).
# Texto: {nome}, {clube}, {idade}, com artigo: {o_clube}, {do_clube}, {no_clube}… Nunca reuse um id.

[[rotina]]
id = "treino-finalizacao"
texto = "O técnico chama {nome} para treino extra de finalização depois do coletivo."
[[rotina.opcao]]
texto = "Topar e ficar até escurecer"
chance = 70
bonus = "fisico"
sucesso = { atributos = { finalizacao = 3 } }
fracasso = { jogos = 0.8, nota = -1 }
[[rotina.opcao]]
texto = "Agradecer e ir descansar"
sucesso = {}

[[rotina]]
id = "folga-ou-academia"
texto = "Dia de folga {no_clube}. Os companheiros chamam para um churrasco."
[[rotina.opcao]]
texto = "Ir ao churrasco e fortalecer o grupo"
chance = 80
sucesso = { atributos = { lideranca = 2 } }
fracasso = { nota = -2 }
[[rotina.opcao]]
texto = "Passar o dia na academia"
chance = 85
bonus = "fisico"
sucesso = { atributos = { fisico = 2 } }
fracasso = { jogos = 0.85 }

[[rotina]]
