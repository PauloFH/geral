# Eventos da Carreira: o que pode acontecer numa temporada, com manchete de jornal.
# momento "antes" vem antes dos números da temporada (pode tirar jogos: efeito.jogos);
# "depois" pode exigir gols, jogos ou título. Campos das manchetes: {nome}, {clube},
# {liga}, {campeonato}, {gols}, {jogos}, {idade}. Nunca reuse um id.

[[evento]]
id = "temporada-comum"
peso = 0.5
unico = false
condicao = { idade_min = 17 }
manchetes = [
  "{nome} cumpre mais uma temporada pelo {clube}",
  "Ano discreto de {nome} no {clube}",
  "{nome} segue no elenco do {clube}",
]

[[evento]]
id = "base-destaque"
peso = 3
momento = "antes"
condicao = { idade_max = 16 }
